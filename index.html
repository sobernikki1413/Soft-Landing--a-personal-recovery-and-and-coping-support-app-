<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Landing • Preview</title><style>
:root{--o:#123b4b;--sea:#316e79;--mist:#e7f0ef;--rose:#f1dbe4;--ink:#25434a}*{box-sizing:border-box}body{margin:0;background:#e6eeee;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}.app{max-width:940px;min-height:100vh;margin:auto;background:#fffdfb;box-shadow:0 8px 50px #123b4b24;display:grid;grid-template-columns:200px 1fr}aside{background:var(--o);color:white;padding:25px 14px}aside h1{font-size:25px;margin:0 0 5px}aside p{color:#c7e1e3;font-size:13px;margin-bottom:28px}nav{display:grid;gap:5px}nav button{background:none;border:0;text-align:left;color:#e1eff0;padding:13px;border-radius:10px;font:inherit;cursor:pointer}nav button.active{background:#ffffff2e}main{padding:30px;min-width:0}h2{font-size:27px;margin:0 0 20px}h3{margin:0 0 10px}p{line-height:1.55}.hero{background:linear-gradient(125deg,#123b4b,#397983);color:white;border-radius:22px;padding:26px;margin-bottom:17px}.hero h3{font-size:25px}.hero p{color:#dbeaed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{border:1px solid #d7e4e5;border-radius:17px;background:white;padding:19px;margin-bottom:12px}.card p{color:#5a7479;font-size:14px}.btn{background:var(--sea);border:0;border-radius:11px;color:white;padding:11px 15px;cursor:pointer;font:inherit;font-weight:600}.btn.soft{background:var(--rose);color:#603e4c}.btn.alt{background:var(--mist);color:var(--o)}label{display:block;font-weight:600;font-size:14px;margin:15px 0 6px}textarea,input,select{width:100%;border:1px solid #b9d1d3;border-radius:10px;padding:11px;font:inherit;background:white}textarea{min-height:85px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #c7d9da;background:white;border-radius:30px;padding:8px 11px;cursor:pointer}.chip.on{background:#c8e1e3;border-color:#498b94}.entry{border:1px solid #d5e2e3;padding:13px;border-radius:12px;margin:9px 0;background:#fff}.entry small{color:#658086}.entry p{white-space:pre-wrap;overflow-wrap:anywhere}.stats{display:flex;gap:10px}.stats div{background:#f8eaf0;padding:15px;border-radius:13px;flex:1;text-align:center}.stats strong{display:block;font-size:25px}.notice{background:#fbf3e5;border:1px solid #e9d9bb;border-radius:12px;padding:13px;font-size:13px;margin:18px 0}.foot{font-size:12px;color:#627c81;margin:25px 0 65px}.bottom{display:none}.circle{height:145px;width:145px;border-radius:50%;background:radial-gradient(circle,#f3dbe5,#89b8bf);display:grid;place-items:center;text-align:center;margin:25px auto;transition:transform 1s;font-weight:700}.circle.in{transform:scale(1.13)}.circle.out{transform:scale(.89)}.hide{display:none}@media(max-width:650px){.app{display:block}aside{display:none}main{padding:22px 16px}.grid{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fffdfbf5;border-top:1px solid #c8dbdc;padding:9px 2px max(9px,env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:transparent;color:#426d74;font-size:11px;padding:8px 0}.bottom button.active{font-weight:800;color:#143b4a}.stats div{padding:9px}.stats strong{font-size:20px}}
</style></head><body><div class="app"><aside><h1>🌊 Soft Landing</h1><p>A gentle place to begin again.</p><nav id="side"></nav></aside><main><h2 id="title">Welcome to Soft Landing</h2><div id="screen"></div><p class="foot">PREVIEW ONLY • Browser-based demonstration, not a finished or clinically validated app. Do not enter sensitive information. Saved entries stay in this browser unless exported.</p></main></div><nav class="bottom" id="bottom"></nav><script>
const tabs=[['home','⌂ Home'],['mental','♡ Mental Health'],['reflect','✎ Reflect'],['growth','✿ My Growth'],['more','☼ More']];let page='home',mood='',strategies=[],timer=null;const store=k=>{try{return JSON.parse(localStorage.getItem('sl_'+k)||'[]')}catch{return []}},put=(k,a)=>localStorage.setItem('sl_'+k,JSON.stringify(a));const el=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>new Date().toLocaleString();const b=(text,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${text}</button>`;
function nav(p){if(timer){clearInterval(timer);timer=null}page=p;render()}function menu(){for(const id of ['side','bottom'])el(id).innerHTML=tabs.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="nav('${k}')">${n}</button>`).join('')}
function rows(kind){let a=store(kind);return a.length?a.map((x,i)=>`<div class="entry"><small>${escapeHtml(x.date)}</small><p>${escapeHtml(x.text||'')}${x.mood?'Mood: '+escapeHtml(x.mood)+'\n':''}${x.trigger?'Trigger: '+escapeHtml(x.trigger)+'\n':''}${x.spend?'Spending note: '+escapeHtml(x.spend)+'\n':''}${x.strategies?.length?'Coping: '+escapeHtml(x.strategies.join(', '))+'\n':''}${x.helped?'What helped: '+escapeHtml(x.helped)+'\n':''}${x.need?'Next support: '+escapeHtml(x.need):''}${x.answers?x.answers.map(v=>'\n'+escapeHtml(v.q)+'\n'+escapeHtml(v.a)).join('\n'):''}</p>${b('Delete',`del('${kind}',${i})`,'alt')}</div>`).join(''):'<div class="entry">Nothing saved here yet. No pressure to start.</div>'}
function del(k,i){if(!confirm('Delete this entry permanently?'))return;let a=store(k);a.splice(i,1);put(k,a);render()}
function render(){menu();el('title').textContent=({home:'Welcome to Soft Landing',mental:'Support for this moment',reflect:'Your reflections',growth:'Your growth matters',more:'Settings & preview info',checkin:'Daily check-in'})[page];let s='';if(page==='home'){s=`<div class="hero"><h3>You don't have to figure it all out today.</h3><p>Take one small breath. Every new moment is another place to begin.</p>${b('♡ Help Me Right Now',"nav('mental')",'soft')}</div><div class="stats"><div><strong>${store('checkins').length}</strong>Check-ins</div><div><strong>${store('reflections').length}</strong>Reflections</div><div><strong>${store('wins').length}</strong>Wins</div></div><h3 style="margin-top:24px">What do you need today?</h3><div class="grid"><div class="card"><h3>♡ Daily check-in</h3><p>Notice how you're feeling, what triggered you, and what helped.</p>${b('Check in',"nav('checkin')")}</div><div class="card"><h3>✎ Reflect</h3><p>A quiet space for thoughts, with optional prompts.</p>${b('Write a reflection',"nav('reflect')")}</div><div class="card"><h3>〰 Calm the moment</h3><p>Breathing, grounding, and spending-urge support.</p>${b('Find support',"nav('mental')")}</div><div class="card"><h3>✿ My Growth</h3><p>Celebrate small wins and keep gentle goals.</p>${b('See my growth',"nav('growth')")}</div></div><div class="notice">A setback does not erase your progress. Your history is yours to revisit, not a scorecard.</div>`}
if(page==='checkin'){s=`<div class="card"><h3>How are you today?</h3><p>Answer only what feels useful. Every field is optional.</p><div class="chips" id="moods">${['Calm','Hopeful','Anxious','Sad','Overwhelmed','Restless','Proud'].map(x=>`<button class="chip ${mood===x?'on':''}" onclick="mood='${x}';render()">${x}</button>`).join('')}</div><label>Triggers or stress</label><textarea id="trigger" placeholder="What felt difficult?"></textarea><label>Spending or recovery note (optional)</label><textarea id="spend" placeholder="Anything you want to notice?"></textarea><label>Coping strategies you used</label><div class="chips" id="strategies">${['Breathing','Grounding','Reached out','Took a pause','Journaled','Rested'].map(x=>`<button class="chip ${strategies.includes(x)?'on':''}" onclick="toggle('${x}')">${x}</button>`).join('')}</div><label>What helped?</label><textarea id="helped"></textarea><label>What support do you need next?</label><textarea id="need"></textarea><p>${b('Save check-in','saveCheckin()')}</p></div><h3>Check-in history · newest first</h3>${rows('checkins')}`}
if(page==='reflect'){let prompts=['What emotions did I experience today?','What triggered me or made today difficult?','What went well, even if it was something small?','What helped me through a difficult moment?','What do I need right now?','What is one kind thing I can do for myself tomorrow?'];s=`<div class="card"><h3>Make room for yourself</h3><p>Choose any prompt. You can skip the rest.</p>${prompts.map((q,i)=>`<label>${q}</label><textarea id="r${i}"></textarea>`).join('')}${b('Save reflection','saveReflection()')}</div><h3>Reflection history · newest first</h3>${rows('reflections')}`}
if(page==='mental'){s=`<div class="hero"><h3>Just this moment. One step at a time.</h3><p>Pick one tool that feels manageable. You can stop at any time.</p></div><div class="grid"><div class="card"><h3>〰 Breathing</h3><p>A simple guided rhythm with a live countdown.</p>${b('Start breathing',"tool('breathe')")}</div><div class="card"><h3>⌁ Grounding</h3><p>Return to the present using your senses.</p>${b('Try grounding',"tool('ground')")}</div><div class="card"><h3>♡ Spending urge support</h3><p>Pause, name the feeling, and choose a next step.</p>${b('Help with an urge',"tool('urge')")}</div><div class="card"><h3>☼ My coping plan</h3><p>Write down what helps you during a hard moment.</p>${b('Open my plan',"tool('plan')")}</div></div><div id="tool"></div><div class="notice">If you are in immediate danger, call emergency services. In the U.S., call or text 988 for mental health crisis support. This preview is not monitored or a substitute for care.</div>`}
if(page==='growth'){s=`<div class="hero"><h3>Small steps still count.</h3><p>Your progress is more than a streak. You can begin again without losing what mattered.</p>${b('＋ Add a small win','addWin()','soft')}</div><div class="card"><h3>Personal goals</h3>${b('＋ Add goal','addGoal()')}<div style="margin-top:12px">${store('goals').map((g,i)=>`<div class="entry"><label style="margin:0"><input type="checkbox" style="width:auto" ${g.done?'checked':''} onchange="goalDone(${i},this.checked)"> ${escapeHtml(g.text)}</label>${b('Delete',`del('goals',${i})`,'alt')}</div>`).join('')||'<p>No goals yet. You choose the pace.</p>'}</div></div><h3>Wins & accomplishments</h3>${rows('wins')}<div class="card"><h3>Recovery milestones</h3><p>Automatic sobriety and spending-recovery counters are planned but not implemented in this preview. No counters will reset automatically.</p></div>`}
if(page==='more'){s=`<div class="card"><h3>About this preview</h3><p>This is a working browser prototype, not a native iPhone or Android app. It uses browser local storage. Do not enter private recovery, financial, or health information. There is no app lock, encryption, account, or automatic cloud backup.</p></div><div class="card"><h3>Backup and restore</h3><p>Export a JSON file containing the entries in this browser. Treat the file as private. Restore will ask before replacing existing preview entries.</p>${b('Export preview backup','exportBackup()')}<label>Restore a preview backup</label><input type="file" accept=".json,application/json" onchange="importBackup(this)"></div><div class="card"><h3>Delete preview data</h3><p>Delete all entries saved in this browser after confirmation.</p>${b('Clear all preview entries','clearAll()','alt')}</div><div class="card"><h3>Future features</h3><p>App lock, encrypted storage, notifications, recovery-date counters, richer accessibility settings, reliable portable backups, and the online community are not included in this preview.</p></div>`}
el('screen').innerHTML=s}
function toggle(x){strategies=strategies.includes(x)?strategies.filter(y=>y!==x):[...strategies,x];document.querySelectorAll('#strategies .chip').forEach(b=>b.classList.toggle('on',strategies.includes(b.textContent)))}
function saveCheckin(){let a=store('checkins');a.unshift({date:now(),mood,trigger:el('trigger').value,spend:el('spend').value,strategies:[...strategies],helped:el('helped').value,need:el('need').value});put('checkins',a);mood='';strategies=[];render()}
function saveReflection(){let q=['What emotions did I experience today?','What triggered me or made today difficult?','What went well, even if it was something small?','What helped me through a difficult moment?','What do I need right now?','What is one kind thing I can do for myself tomorrow?'];let answers=q.map((q,i)=>({q,a:el('r'+i).value.trim()})).filter(x=>x.a);if(!answers.length){alert('Write in any prompt you choose before saving.');return}let a=store('reflections');a.unshift({date:now(),answers});put('reflections',a);render()}
function addGoal(){let x=prompt('What small goal would you like to set?');if(!x?.trim())return;let a=store('goals');a.push({date:now(),text:x.trim(),done:false});put('goals',a);render()}
function goalDone(i,v){let a=store('goals');a[i].done=v;put('goals',a);render()}
function addWin(){let x=prompt('What small win would you like to recognize?');if(!x?.trim())return;let a=store('wins');a.unshift({date:now(),text:x.trim()});put('wins',a);render()}
function tool(t){if(timer){clearInterval(timer);timer=null}let h='';if(t==='breathe'){h=`<div class="card"><h3>Gentle breathing</h3><p>Follow a comfortable rhythm. If counting feels uncomfortable, breathe naturally instead.</p><div class="circle" id="circle">Ready</div><p id="breathLabel" style="text-align:center">Tap start when ready.</p>${b('Start','startBreath()')} ${b('Stop','stopBreath()','alt')}</div>`}if(t==='ground'){h=`<div class="card"><h3>Grounding with your senses</h3><ol><li>Notice 5 things you can see.</li><li>Notice 4 things you can feel.</li><li>Listen for 3 things you can hear.</li><li>Notice 2 things you can smell, or two comfortable sensations.</li><li>Say 1 kind thing to yourself.</li></ol><p>You can skip any step. You're allowed to go slowly.</p></div>`}if(t==='urge'){h=`<div class="card"><h3>Pause a spending urge</h3><ol><li>Step away from the purchase page if you can.</li><li>Say: “This is an urge. I can wait before deciding.”</li><li>Try a ten-minute pause or another manageable delay.</li><li>Ask: “What feeling or need is underneath this?”</li><li>Choose a non-shopping comfort or someone to contact.</li></ol><label>My next small step</label><textarea id="urgeNote"></textarea><p>${b('Save as a small win','saveUrge()')}</p></div>`}if(t==='plan'){h=`<div class="card"><h3>My personal coping plan</h3><label>What tends to trigger me?</label><textarea id="pTrigger"></textarea><label>What helps me?</label><textarea id="pHelp"></textarea><label>One first step</label><textarea id="pStep"></textarea><p>${b('Save coping plan','savePlan()')}</p><h3>Saved plans</h3>${rows('plans')}</div>`}el('tool').innerHTML=h;el('tool').scrollIntoView({behavior:'smooth',block:'start'})}
function startBreath(){stopBreath();let count=4,inhale=true;function tick(){if(!el('circle')){stopBreath();return}el('circle').className='circle '+(inhale?'in':'out');el('circle').textContent=(inhale?'Breathe in':'Breathe out')+'\n'+count;el('breathLabel').textContent=inhale?'Inhale gently':'Exhale comfortably';count--;if(count===0){inhale=!inhale;count=inhale?4:6}}tick();timer=setInterval(tick,1000)}function stopBreath(){if(timer)clearInterval(timer);timer=null;if(el('circle')){el('circle').className='circle';el('circle').textContent='Paused';el('breathLabel').textContent='Rest as long as you need.'}}
function saveUrge(){let x=el('urgeNote').value.trim();if(!x)return alert('Add a next step if you would like to save it.');let a=store('wins');a.unshift({date:now(),text:'Spending-urge pause: '+x});put('wins',a);alert('Saved in My Growth.')}
function savePlan(){let x={date:now(),text:'Trigger: '+el('pTrigger').value+'\nWhat helps: '+el('pHelp').value+'\nFirst step: '+el('pStep').value};let a=store('plans');a.unshift(x);put('plans',a);tool('plan')}
const keys=['checkins','reflections','goals','wins','plans'];function exportBackup(){let obj={type:'soft-landing-preview',version:1,date:new Date().toISOString(),data:Object.fromEntries(keys.map(k=>[k,store(k)]))};let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='soft-landing-preview-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(d.type!=='soft-landing-preview'||d.version!==1||!d.data||!keys.every(k=>Array.isArray(d.data[k])))throw Error('Unsupported backup');}catch(e){alert('This is not a valid Soft Landing preview backup. Nothing was changed.');return}let counts=keys.map(k=>`${k}: ${d.data[k].length}`).join('\n');if(!confirm('This backup contains:\n'+counts+'\n\nRestore will REPLACE the current preview entries in this browser. Continue?'))return;keys.forEach(k=>put(k,d.data[k]));alert('Preview backup restored.');render()};r.readAsText(f)}
function clearAll(){if(!confirm('Delete ALL saved preview entries in this browser? This cannot be undone.'))return;if(!confirm('Last confirmation: clear all Soft Landing preview entries?'))return;keys.forEach(k=>localStorage.removeItem('sl_'+k));render()}
render();
</script></body></html>
